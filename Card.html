<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">

    <title>card</title>
    <style>
        .card {
            width: 400px;
            /* height: 600px; */
            border: 1px solid rgb(202, 202, 202);
            border-radius: 20px;
        }
        .card-image{
            position: relative;
        }

        .card-image img {
            border-radius: 20px 20px 0 0;
            object-fit: cover;
        }

        .content {
            padding: 12px;
            border-bottom: 1px dashed #cccccc;
        }

        .content h2 {
            font-family: 'Lato', sans-serif;
            font-size: 18px;
            margin: 10px 0 10px 0 !important;
        }

        .content p {
            font-size: 14px;
            font-family: 'Lato', sans-serif;
            color: rgb(102, 102, 102);
            margin: 0px !important;
        }

        .price h3 {
            margin: 22px 0 0 0 !important;
            color: black;
            border-bottom: black dashed 1px;


        }

        .price h3 a {
            margin: 0px;
            color: black;
            text-decoration: dashed
        }

        .price p a span {
            margin: 20px 0 0 0 !important;
            color: black;
            text-decoration: none;
            border-bottom: black dashed 1px;

        }

        .price p a {
            margin: 20px 0 0 0 !important;
            color: rgb(100, 100, 100);
            text-decoration: none;
        }

        .price p {
            margin: 22px 0 0 0 !important;

        }

        .price {
            margin: 0px;
            font-family: 'Lato', sans-serif;
            display: flex;
            justify-content: space-between;
        }

        .Offer {
            margin: 0px;
            font-family: 'Lato', sans-serif;
            display: flex;
            justify-content: space-between;
        }

        .Offer h4 {
            margin: 22px 0 0 0 !important;
        }

        .Offer h4 a {
            color: #034b9e;
            text-decoration: none;
            font-weight: 400;
            font-size: 14px;
        }

        .Offer p {
            margin: 22px 0 0 0 !important;

        }

        .Offer a {
            text-decoration: none;

        }

        .Offer p a span {
            background-color: rgb(218, 218, 218);
            font-size: 12px;
            color: rgb(90, 90, 90);
            padding: 6px;
            border-radius: 4px;
            text-decoration: none;
        }

        .btn {
            margin-top: 20px;

        }

        .btn {
            font-size: 18px;
            color: white;
            text-decoration: none;

        }

        .btn {
            text-align: center;
            width: 100%;
            padding: 12px 0 12px 0;
            background: #ff0000;
            border-radius: 5px;
            display: block;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            opacity: 0.6;


        }

        .btn:hover {
            background: linear-gradient(90deg, rgb(179, 0, 0) 0%, rgb(180, 78, 78) 100%);
            transition: 1;


        }

        .footer {
            padding: 10px;
        }

        .footer p {
            margin: 0px;
        }


        .footer p a {
            color: #969695;
            text-decoration: none;
            font-family: 'Lato', sans-serif;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .badge{
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: red;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-family: 'Lato', sans-serif;

        }
    </style>
</head>

<body>
    <div class="card">
        <div class="card-image">
            <img src="images/card-car.avif">
            <span class="badge">New</span>
        </div>
        <div class="content">
            <h2>2019 BMW 7-Series 730Ld DPE Signature</h2>
            <p>42,000 km | Diesel | Kurla West, Mumbai</p>
            <div class="price">
                <h3><a href="#">Rs. 35 Lakh</a></h3>
                <p><a href="#">EMI at <span>Rs.62,994</span></a></p>
            </div>
            <div class="Offer">
                <h4><a href="#">Make Offer</a></h4>
                <p><a href="#"><span>Home Test Drive</span></a></p>
            </div>
            <div class="btn1">
                <button class="btn">Get Seller Details</button>
            </div>
        </div>
        <div class="footer">
            <p><a href="#"><img src="images/menu1.png" width="12px">Panoramic Sunroof</a></p>
        </div>

    </div>
</body>

</html>
